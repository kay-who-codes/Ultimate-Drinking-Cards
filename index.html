<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UDC</title>

  <link rel="icon" type="image/x-icon" href="AppFiles/Icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="AppFiles/Logos/AppIcon192px.png">
  <link rel="icon" type="image/png" sizes="512x512" href="AppFiles/Logos/AppIcon512px.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1210">

<style>


  :root {
    --bg: #131313;
    --card-bg: #ffffff;
    --card-text: #000000;
    --card-black-bg: #000000;
    --card-black-text: #ffffff;
    --card-red-bg: #eb0e0e;
    --card-red-text: #ffffff;
    --accent: #999999;
    --muted: #767676;
    --panel-bg: #e3e3e3;
    --panel-text: #000000;
    --btn-bg: #5b5b5b;
    --btn-text: #ffffff;

    --font-new: 'CustomFont', system-ui, -apple-system, 'Segoe UI', sans-serif;

  }

  * { box-sizing: border-box; }

  @font-face {
    font-family: 'CustomFont';
    src: url('AppFiles/Fonts/UDC.ttf') format('truetype');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
}

  body {
    background-color: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: background-color 0.3s;
  }

  #app {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    gap: 14px;
    width: 100%;
  }

  /* Top bar / cog */
  #topBar {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    z-index: 900;
  }

  #cogButton {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ffffff;
    font-size: 24px;
    width: 46px;
    height: 46px;
    margin-top: -10px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s;
  }
  #cogButton:hover { background: rgba(255,255,255,0.18); transform: rotate(25deg); }

  /* Turn tracker */
  #turnTracker {
    color: #ffffff;
    font-family: Tahoma, sans-serif;
    text-align: center;
    min-height: 50px;
  }
  #turnTracker .turnLabel {
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  #turnTracker .turnName {
    font-size: 26px;
    font-weight: bold;
    color: var(--accent);
    animation: turnNameIn 0.4s ease-out;
  }

  @keyframes turnNameIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #turnTracker .roundLabel {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }

  /* Setup overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }

  .setup-box {
    background-color: var(--panel-bg);
    color: var(--panel-text);
    padding: 36px 32px;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    font-family: Tahoma, sans-serif;
    text-align: center;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.45),
      0 2px 0 rgba(255,255,255,0.4) inset;
    border: 1px solid rgba(0,0,0,0.06);
    animation: setupBoxIn 0.28s ease-out;
  }

  @keyframes setupBoxIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .setup-box h2 {
    margin-top: 0;
    margin-bottom: 4px;
    font-size: 25px;
    letter-spacing: 0.2px;
  }

  .setup-box p.sub {
    font-size: 13.5px;
    color: #6b6b6b;
    margin-top: 0;
    margin-bottom: 24px;
  }

  .setup-field {
    text-align: left;
    margin-bottom: 18px;
  }

  .setup-field label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
    color: #555;
  }

  .setup-field input[type="text"],
  .setup-field input[type="number"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background-color: #fff;
    font-size: 15px;
    font-family: Tahoma, sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .setup-field input[type="text"]:hover,
  .setup-field input[type="number"]:hover {
    border-color: #999;
  }

  .setup-field input[type="text"]:focus,
  .setup-field input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  #playerNamesContainer {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .roundsRow {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .roundsRow label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: normal;
    text-transform: none;
    font-size: 14px;
    color: var(--panel-text);
    cursor: pointer;
  }

  .setup-field input[type="radio"],
  .setup-field input[type="checkbox"] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .setup-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .setup-btn-row button,
  .primary-btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background-color: var(--accent);
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent);
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .setup-btn-row button:hover,
  .primary-btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .setup-btn-row button:active,
  .primary-btn:active {
    transform: translateY(0);
  }

  .secondary-btn {
    background-color: transparent !important;
    color: #333 !important;
    border: 1px solid #999 !important;
    box-shadow: none !important;
  }

  .small-add-btn {
    padding: 9px;
    border-radius: 8px;
    border: 1px dashed #aaa;
    background: rgba(0,0,0,0.02);
    cursor: pointer;
    font-size: 13px;
    color: #444;
    font-weight: 600;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .small-add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }

  .toggleButtonRow {
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.04);
    padding: 4px;
    border-radius: 10px;
  }

  .toggle-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: #555;
    font-size: 13.5px;
    font-weight: bold;
    font-family: var(--font-new);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }

  .toggle-btn:hover {
    color: #222;
  }

  .toggle-btn.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 45%, transparent);
  }

  /* Theme / settings menu */
  #themeMenu {
    position: fixed;
    top: calc(70px + env(safe-area-inset-top, 0px));
    right: 16px;
    background-color: var(--panel-bg);
    color: var(--panel-text);
    border-radius: 16px;
    padding: 0;
    width: 260px;
    max-height: 75vh;
    overflow-y: auto;
    z-index: 950;
    display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
    border: 1px solid rgba(0,0,0,0.08);
    font-family: var(--font-new);
  }

  #themeMenu .menuSection {
    padding: 16px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  #themeMenu .menuSection:last-child {
    border-bottom: none;
  }

  #themeMenu h3 {
    margin: 0 0 12px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
    color: var(--muted);
  }

  .theme-swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 4px;
  }

  .theme-swatch {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid rgba(0,0,0,0.12);
    position: relative;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, border-color 0.2s;
  }
  .theme-swatch:hover {
    transform: scale(1.1);
  }
  .theme-swatch.active {
    border-color: #333;
    transform: scale(1.22);
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .theme-swatch.active::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  #themeMenu .menu-action {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.15);
    background: rgba(0,0,0,0.03);
    cursor: pointer;
    font-family: var(--font-new);
    font-size: 13px;
    font-weight: 200;
    color: var(--panel-text);
    margin-top: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  #themeMenu .menu-action:hover {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: var(--accent);
  }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .category-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: normal;
    text-transform: none;
    color: var(--panel-text);
    cursor: pointer;
  }

  .category-swatch-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .category-empty {
    font-size: 12px;
    color: #777;
    font-style: italic;
  }

  /* Card styles */
  .card {
    width: min(300px, 88vw);
    height: min(400px, 56vh, 480px);
    background-color: var(--card-bg);
    color: var(--card-text);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), border 0.3s;
    z-index: 1;
    flex-shrink: 0;
  box-shadow:
        0px 0px 5px 10px rgba(255,255,255,0.01),
        0px 0px 0px 6px var(--category-glow, transparent);
  transition:
    transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
    border 0.3s,
    box-shadow 0.55s ease-out;
  }

  .card.type-black {
    border: 2px solid #000000;
  }
  .card.type-red {
    border: 2px solid var(--card-red-bg);
  }

  .card .card-front,
  .card .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: left;
    flex-direction: column;
    border-radius: 15px;
    padding: 35px;
    font-family: var(--font-new);
    overflow: hidden;
    box-shadow:
        0 0 30px 0px rgba(255,255,255,0.1),
        0 0 28px 6px var(--category-glow, transparent);
  }

  .card .card-front {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
    text-align: left;
    background-color: var(--card-bg);
    color: var(--card-text);
    font-family: var(--font-new);
  }

  .card .card-back {
    transform: rotateY(180deg);
    font-size: 24px;
    text-align: left;
    background-color: var(--card-bg);
    color: var(--card-text);
    transition: background-color 0.3s, color 0.3s;
  }

  @keyframes glowPulse {
  0% {
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 12px 2px var(--category-glow, transparent);
  }
  50% {
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 34px 10px var(--category-glow, transparent);
  }
  100% {
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 28px 6px var(--category-glow, transparent);
  }
}

.card.revealing {
  animation: glowPulse 0.7s ease-out;
}

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-back .instructionText,
  .card-front .instructionText {
    font-size: clamp(18px, 6vw, 26px);
    font-weight: 600;
    letter-spacing: -0.3px;
    line-height: 1.15;
    margin-bottom: auto;
    overflow-wrap: break-word;
  }

  .card-back .categoryText,
  .card-front .categoryText {
    font-size: 17px;
    margin-top: 6%;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.3px;
    text-decoration: underline;
  }

  .card-back .tripleBadge,
  .card-front .tripleBadge {
    display: inline-block;
    align-self: flex-start;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background-color: rgba(255,255,255,0.85);
    color: #8b0000;
  }

  #resetButton {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #ffffff;
    color: #131313;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
  }

  #resetButton:hover {
    background-color: #dddddd;
  }

  .card .card-front.type-black,
  .card .card-back.type-black {
    background-color: var(--card-black-bg);
    color: var(--card-black-text);
  }
  .card .card-front.type-black .instructionText,
  .card .card-back.type-black .instructionText {
    color: var(--card-black-text);
  }
  .card .card-front.type-black .categoryText,
  .card .card-back.type-black .categoryText {
    color: var(--accent);
  }

  .card .card-front.type-red,
  .card .card-back.type-red {
    background-color: var(--card-red-bg);
    color: var(--card-red-text);
  }
  .card .card-front.type-red .instructionText,
  .card .card-back.type-red .instructionText {
    color: var(--card-red-text);
  }
  .card .card-front.type-red .categoryText,
  .card .card-back.type-red .categoryText {
    color: var(--card-red-text);
  }

  #footer {
    position: fixed;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    text-align: center;
    font-size: 16px;
    color: var(--muted);
  }

  #footer a {
    color: var(--accent);
    text-decoration: none;
  }

  #footer a:hover {
    text-decoration: underline;
  }

  #rulesButtonContainer {
    position: fixed;
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    text-align: center;
    padding: 40px;
  }

  #showRulesLink {
    color: var(--muted);
    font-size: 18px;
    text-decoration: none;
    cursor: pointer;
  }

  #showRulesLink:hover {
    text-decoration: underline;
  }

  /* Rules modal - improved formatting */
  .modal-content {
    background-color: var(--panel-bg);
    color: var(--panel-text);
    padding: 24px;
    border-radius: 12px;
    border: 2px solid #ccc;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    font-family: Tahoma, sans-serif;
  }

  #closeRulesButton {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid black;
  }

  #closeRulesButton:hover {
    background-color: var(--accent);
  }

  #viewAllCardsButton {
    margin-top: 10px;
    padding: 10px 20px;
    background-color: transparent;
    color: var(--panel-text);
    border: 2px solid var(--accent);
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
    font-family: Tahoma, sans-serif;
    font-size: 14px;
    font-weight: bold;
    transition: background-color 0.2s, color 0.2s;
  }

  #viewAllCardsButton:hover {
    background-color: var(--accent);
    color: #ffffff;
  }

  #rulesText h2 {
    margin-top: 0;
    font-size: 22px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
  }

  #rulesText h3 {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 0 8px 0;
    color: #333;
  }

  #rulesText ol,
  #rulesText ul {
    margin: 0 0 12px 0;
    padding-left: 22px;
  }

  #rulesText li {
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .rule-card-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    margin-right: 4px;
  }
  .rule-card-tag.white { background-color: #999; color: #000; border: 1px solid #666; }
  .rule-card-tag.black { background-color: #000; }
  .rule-card-tag.red { background-color: #8b0000; }

  #rulesText .tip {
    font-size: 13px;
    color: #555;
    font-style: italic;
    margin-top: 10px;
  }

  .all-cards-list li {
    margin-bottom: 10px;
  }

  .all-cards-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .all-cards-controls input[type="text"],
  .all-cards-controls select {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background-color: #fff;
    color: #000;
    font-size: 14px;
    font-family: Tahoma, sans-serif;
  }

  .all-cards-controls input[type="text"] {
    flex: 2;
    min-width: 140px;
  }

  .all-cards-controls select {
    flex: 1;
    min-width: 120px;
  }

  .all-cards-controls input[type="text"]:focus,
  .all-cards-controls select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .all-cards-empty {
    font-size: 14px;
    color: #555;
    font-style: italic;
  }

  .all-cards-count {
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
  }

  .all-cards-category-tag {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #fff;
    margin-right: 6px;
  }

  @media (max-width: 600px) {
    .modal-content {
      padding: 15px;
      max-width: 90%;
      width: 100%;
    }
    #closeRulesButton {
      padding: 8px 16px;
    }
    .card {
      width: min(88vw, 320px);
      height: min(58vh, 420px);
    }
    .card .card-front,
    .card .card-back {
      padding: 22px;
    }
  }

  @media (max-height: 700px) {
    .card {
      height: min(50vh, 380px);
    }
  }

    /* --- REPO SEARCH BAR - ALIGNED TO TOP LEFT (like the cog on top right) --- */
.kwc-repo-search {
  position: fixed !important;
  top: calc(16px + env(safe-area-inset-top, 0px)) !important;
  left: calc(16px + 46px + 10px) !important;   /* icon width + gap */
  right: auto !important;
  bottom: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  z-index: 900 !important;
  display: flex !important;
  align-items: center !important;
  transform: none !important;
}

  /* Neutralize any injected inline/relative offsets from Header.js */
  .kwc-repo-search * {
    margin-left: 0 !important;
  }

  #kwc-repo-search {
    position: fixed !important;

  .card-counter #cardCounterNumber {
  display: inline-block;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.card-counter #cardCounterNumber.changing {
  opacity: 0;
  transform: translateY(-4px);
}

.black-flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0) 25%, rgba(0,0,0,0.85) 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 2000;

}
.black-flash.active {
  opacity: 1;

}

  .red-flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, rgba(235, 14, 14, 0.45) 0%, rgba(235,14,14,0.75) 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 2000;

}

.red-flash.active {

#spinIcon {

}

#spinIcon img,
#spinIcon svg {
  display: block;

}

@keyframes spinLoop {
  0%, 30% {
    transform: rotate(0deg);
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
  }
  36% {
    transform: rotate(90deg);
    animation-timing-function: linear;
  }
  60% {
    transform: rotate(90deg);
    animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
  }
  66%, 100% {
    transform: rotate(0deg);

}

.emptyDeck {

.emptyDeckEmoji { font-size: 56px; }
.emptyDeckTitle {

.emptyDeckSub {
  font-family: var(--font-new);

  opacity: 0.7;
}

.card:focus-visible {

}

.loading-spinner {
  width: 42px;

}
@keyframes spinSpinner {
  to { transform: rotate(360deg); }
}
.loading-text {
  font-family: var(--font-new);
  font-size: 18px;
  color: var(--muted);
  text-align: center;
}

</style></head>

  <script src="https://cdn.jsdelivr.net/gh/kay-who-codes/Kay-App-Assets@main/Headers/Header.js"></script>
  
  <script>
  const coverCard = document.getElementById("coverCard");
  const cardFront = coverCard.querySelector(".card-front");
  const cardBack = coverCard.querySelector(".card-back");

  // ---------- Data shapes ----------
  // OLD: allCards = [{ Category, Rule, Colour }, ...]  (one entry per rule)
  // NEW: allCards = [{ Category, Colour, Rules: [rule, rule, ...] }, ...] (one entry per category)
  //
  // Internally we now work with "draws": individual { Category, Colour, Rule } entries,
  // reconstructed from the grouped data so all the existing game logic still works.
  let cards = [];          // remaining draws in the current deck
  let allCards = [];       // grouped category objects, straight from cards.json
  let allDraws = [];       // flat list of every individual draw, for "View All Cards"
  let showingFront = true;
  const NORMAL_BLACK_CHANCE = 0.15;
  const NORMAL_RED_CHANCE = NORMAL_BLACK_CHANCE / 2;
  const CRAZY_BLACK_CHANCE = 0.33;
  const CRAZY_RED_CHANCE = CRAZY_BLACK_CHANCE / 1.5;

  let difficulty = "normal";                // "normal" | "crazy"
  let BLACK_CHANCE = NORMAL_BLACK_CHANCE;
  let RED_CHANCE = NORMAL_RED_CHANCE;

  const difficultyRow = document.getElementById("difficultyRow");
const difficultyNormalBtn = document.getElementById("difficultyNormalBtn");
const difficultyCrazyBtn = document.getElementById("difficultyCrazyBtn");

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function setDifficulty(mode) {
  difficulty = mode;
  difficultyNormalBtn.classList.toggle("active", mode === "normal");
  difficultyCrazyBtn.classList.toggle("active", mode === "crazy");
  if (mode === "crazy") {
    BLACK_CHANCE = CRAZY_BLACK_CHANCE;
    RED_CHANCE = CRAZY_RED_CHANCE;
  } else {
    BLACK_CHANCE = NORMAL_BLACK_CHANCE;
    RED_CHANCE = NORMAL_RED_CHANCE;
  }
}

difficultyNormalBtn.addEventListener("click", () => setDifficulty("normal"));
difficultyCrazyBtn.addEventListener("click", () => setDifficulty("crazy"));

  let enabledCategories = new Set();
  const categoryColours = {};

  let players = [];
  let currentPlayerIndex = 0;
  let currentRound = 1;
  let totalRounds = 5;
  let unlimitedRounds = false;
  let gameStarted = true;
  let trackingEnabled = false;

  let totalDrawsInPlay = 0;   // total draws in the current filtered deck
  let drawnCount = 0;         // how many draws have been revealed

  const turnTracker = document.getElementById("turnTracker");
  const cardCounter = document.getElementById("cardCounter");

  // Flatten a grouped category object into one draw per rule.
function groupToDraws(group) {
    const rules = Array.isArray(group.Rules) ? group.Rules : [];
    const colour = group.Colour || group.Color || group.color || group.colour || "#999999";
    return rules.map(rule => ({
      Category: group.Category || "",
      Colour: colour,
      Rule: rule
    }));
  }

  function updateTurnTracker() {
    if (!gameStarted || !trackingEnabled || players.length === 0) {
      turnTracker.innerHTML = "";
      return;
    }
    const diffBadge = difficulty === "crazy" ? ` · <span style="color:#ff4747;">CRAZY</span>` : "";
    const roundText = (unlimitedRounds ? `Round ${currentRound}` : `Round ${currentRound} of ${totalRounds}`) + diffBadge;
    turnTracker.innerHTML = `
      <div class="turnLabel">It's your turn</div>
      <div class="turnName">${players[currentPlayerIndex]}</div>
      <div class="roundLabel">${roundText}</div>
    `;
  }

  function advanceTurn() {
    if (!gameStarted || !trackingEnabled || players.length === 0) return;
    currentPlayerIndex++;
    if (currentPlayerIndex >= players.length) {
      currentPlayerIndex = 0;
      currentRound++;
      if (!unlimitedRounds && currentRound > totalRounds) {
        currentRound = totalRounds;
        turnTracker.innerHTML = `
          <div class="turnLabel">Game complete</div>
          <div class="turnName" style="color: var(--accent);">🎉 Nice one!</div>
          <div class="roundLabel">Tap ⚙️ to restart or change players</div>
        `;
        return;
      }
    }
    updateTurnTracker();
  }

  const setupOverlay = document.getElementById("setupOverlay");
  const playerNamesContainer = document.getElementById("playerNamesContainer");
  const addPlayerButton = document.getElementById("addPlayerButton");
  const roundsInput = document.getElementById("roundsInput");
  const unlimitedRoundsCheckbox = document.getElementById("unlimitedRoundsCheckbox");
  const startGameButton = document.getElementById("startGameButton");
  const trackingOnBtn = document.getElementById("trackingOnBtn");
  const trackingOffBtn = document.getElementById("trackingOffBtn");
  const trackingFields = document.getElementById("trackingFields");

  let trackingModeSelected = "off";

  function toggleTrackingFieldsVisibility() {
    trackingFields.style.display = trackingModeSelected === "on" ? "block" : "none";
  }

  function setTrackingMode(mode) {
    trackingModeSelected = mode;
    trackingOnBtn.classList.toggle("active", mode === "on");
    trackingOffBtn.classList.toggle("active", mode === "off");
    toggleTrackingFieldsVisibility();
  }

  trackingOnBtn.addEventListener("click", () => setTrackingMode("on"));
  trackingOffBtn.addEventListener("click", () => setTrackingMode("off"));

  function createPlayerRow(name = "") {
    const row = document.createElement("input");
    row.type = "text";
    row.className = "playerNameInput";
    row.placeholder = `Player ${playerNamesContainer.children.length + 1}`;
    row.value = name;
    playerNamesContainer.appendChild(row);
  }

  function resetSetupFields(prefillNames = ["", ""], prefillRounds = 5, prefillUnlimited = false, prefillTracking = false) {
    playerNamesContainer.innerHTML = "";
    prefillNames.forEach(n => createPlayerRow(n));
    roundsInput.value = prefillRounds;
    unlimitedRoundsCheckbox.checked = prefillUnlimited;
    roundsInput.disabled = prefillUnlimited;
    setTrackingMode(prefillTracking ? "on" : "off");
  }

  addPlayerButton.addEventListener("click", () => createPlayerRow());

  unlimitedRoundsCheckbox.addEventListener("change", () => {
    roundsInput.disabled = unlimitedRoundsCheckbox.checked;
  });

  function openSetupOverlay() {
    setupOverlay.style.display = "flex";
  }

  function closeSetupOverlay() {
    setupOverlay.style.display = "none";
  }

  // Build the deck of individual draws from the enabled categories.
  function buildDeckFromEnabledCategories() {
    const enabledGroups = allCards.filter(c => enabledCategories.has(c.Category || ""));
    const source = (enabledGroups.length || allCards.length === 0)
      ? enabledGroups
      : allCards; // safety net: if nothing enabled, use everything
    cards = source.flatMap(groupToDraws);
    totalDrawsInPlay = cards.length;
    drawnCount = -1;
    updateCardCounter();
  }

  const cardCounterNumber = document.getElementById("cardCounterNumber");
const cardCounterSuffix = document.getElementById("cardCounterSuffix");

function updateCardCounter() {
  if (!totalDrawsInPlay) {
    cardCounterNumber.textContent = "";
    cardCounterSuffix.textContent = "";
    return;
  }
  const current = Math.min(drawnCount + 1, totalDrawsInPlay);
  const newText = String(current);

  if (cardCounterNumber.textContent !== newText) {
    cardCounterNumber.classList.add("changing");
    setTimeout(() => {
      cardCounterNumber.textContent = newText;
      cardCounterSuffix.textContent = ` of ${totalDrawsInPlay}`;
      cardCounterNumber.classList.remove("changing");
    }, 180);
  }
}

  startGameButton.addEventListener("click", () => {
    trackingEnabled = trackingModeSelected === "on";

    if (trackingEnabled) {
      const nameInputs = Array.from(document.querySelectorAll(".playerNameInput"));
      const names = nameInputs.map((input, i) => input.value.trim() || `Player ${i + 1}`);

      if (names.length < 1) {
        alert("Add at least one player.");
        return;
      }

      players = names;
      currentPlayerIndex = 0;
      currentRound = 1;
      unlimitedRounds = unlimitedRoundsCheckbox.checked;
      totalRounds = unlimitedRounds ? Infinity : Math.max(1, parseInt(roundsInput.value, 10) || 1);
    } else {
      players = [];
    }

    gameStarted = true;

    closeSetupOverlay();
    updateTurnTracker();

    buildDeckFromEnabledCategories();
    preloadNextCard();
  });

  // ---------- Theme menu ----------
  const cogButton = document.getElementById("cogButton");
  const themeMenu = document.getElementById("themeMenu");
  const themeSwatchRow = document.getElementById("themeSwatchRow");
  const editPlayersButton = document.getElementById("editPlayersButton");
  const restartGameButton = document.getElementById("restartGameButton");
  const categoryList = document.getElementById("categoryList");
  const selectAllCategoriesButton = document.getElementById("selectAllCategoriesButton");
  const deselectAllCategoriesButton = document.getElementById("deselectAllCategoriesButton");

  const themes = [
    { id: "mono",     label: "Mono",     bg: "#101010", accent: "#9a9a9a",
      cardBg: "#ffffff", cardText: "#000000",
      cardBlackBg: "#000000", cardBlackText: "#ffffff",
      cardRedBg: "#E61111", cardRedText: "#ffffff",
      panelBg: "#eeeeee", panelText: "#101010" },
    { id: "classic",  label: "Classic",  bg: "#180606", accent: "#FF4747",
      cardBg: "#FFE5E5", cardText: "#000000",
      cardBlackBg: "#000000", cardBlackText: "#FFC6C6",
      cardRedBg: "#E61111", cardRedText: "#FFF0F0",
      panelBg: "#e3e3e3", panelText: "#000000" },
    { id: "midnight", label: "Midnight", bg: "#0b0f2b", accent: "#5da9ff",
      cardBg: "#eef3ff", cardText: "#0b0f2b",
      cardBlackBg: "#050814", cardBlackText: "#CEDFFF",
      cardRedBg: "#E61111", cardRedText: "#ffe3ec",
      panelBg: "#e6ecff", panelText: "#0b0f2b" },
    { id: "emerald",  label: "Emerald",  bg: "#0D1F0F", accent: "#3ddc84",
      cardBg: "#EAFFEF", cardText: "#0d1f16",
      cardBlackBg: "#04120a", cardBlackText: "#BEFFD8",
      cardRedBg: "#E61111", cardRedText: "#ffe3e3",
      panelBg: "#e2f5e9", panelText: "#0d1f16" },
    { id: "plum",     label: "Plum",     bg: "#1e0f24", accent: "#c66bff",
      cardBg: "#f6ecff", cardText: "#1e0f24",
      cardBlackBg: "#100713", cardBlackText: "#EDD4FF",
      cardRedBg: "#E61111", cardRedText: "#ffe1ef",
      panelBg: "#efe1fb", panelText: "#1e0f24" },
    { id: "sunset",   label: "Sunset",   bg: "#241205", accent: "#FF9A47",
      cardBg: "#FFF3E6", cardText: "#241205",
      cardBlackBg: "#130a03", cardBlackText: "#FFE2B7",
      cardRedBg: "#E61111", cardRedText: "#ffe6e6",
      panelBg: "#fdeedb", panelText: "#241205" },
  ];

  const customThemePanel = document.getElementById("customThemePanel");
  const customBgInput = document.getElementById("customBgInput");
  const customAccentInput = document.getElementById("customAccentInput");
  const customCardBgInput = document.getElementById("customCardBgInput");
  const customPanelBgInput = document.getElementById("customPanelBgInput");

  function readableTextColor(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150 ? "#000000" : "#ffffff";
  }

  function hexToRgba(hex, alpha = 1) {
    if (typeof hex !== "string") return `rgba(153,153,153,${alpha})`;
    const c = hex.replace('#', '').trim();
    const full = c.length === 3 ? c.split('').map(x => x + x).join('') : c;
    if (!/^[0-9a-fA-F]{6}$/.test(full)) return `rgba(153,153,153,${alpha})`;
    const r = parseInt(full.substring(0, 2), 16);
    const g = parseInt(full.substring(2, 4), 16);
    const b = parseInt(full.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function applyTheme(themeId) {
    if (themeId === "custom") {
      customThemePanel.style.display = "block";
      document.querySelectorAll(".theme-swatch").forEach(el => {
        el.classList.toggle("active", el.dataset.themeId === "custom");
      });
      try { localStorage.setItem("udcTheme", "custom"); } catch (e) {}
      return;
    }
    customThemePanel.style.display = "none";

    const t = themes.find(t => t.id === themeId) || themes[0];
    const root = document.documentElement;
    root.style.setProperty("--bg", t.bg);
    root.style.setProperty("--accent", t.accent);
    root.style.setProperty("--card-bg", t.cardBg);
    root.style.setProperty("--card-text", t.cardText);
    root.style.setProperty("--card-black-bg", t.cardBlackBg);
    root.style.setProperty("--card-black-text", t.cardBlackText);
    root.style.setProperty("--card-red-bg", t.cardRedBg);
    root.style.setProperty("--card-red-text", t.cardRedText);
    root.style.setProperty("--panel-bg", t.panelBg);
    root.style.setProperty("--panel-text", t.panelText);
    document.querySelectorAll(".theme-swatch").forEach(el => {
      el.classList.toggle("active", el.dataset.themeId === themeId);
    });
    try { localStorage.setItem("udcTheme", themeId); } catch (e) {}
  }

  function applyCustomTheme(save = true) {
    const bg = customBgInput.value;
    const accent = customAccentInput.value;
    const cardBg = customCardBgInput.value;
    const panelBg = customPanelBgInput.value;
    const root = document.documentElement;
    root.style.setProperty("--bg", bg);
    root.style.setProperty("--accent", accent);
    root.style.setProperty("--card-bg", cardBg);
    root.style.setProperty("--card-text", readableTextColor(cardBg));
    root.style.setProperty("--card-black-bg", "#000000");
    root.style.setProperty("--card-black-text", "#ffffff");
    root.style.setProperty("--card-red-bg", "#eb0e0e");
    root.style.setProperty("--card-red-text", "#ffffff");
    root.style.setProperty("--panel-bg", panelBg);
    root.style.setProperty("--panel-text", readableTextColor(panelBg));
    document.querySelectorAll(".theme-swatch").forEach(el => {
      el.classList.toggle("active", el.dataset.themeId === "custom");
    });
    if (save) {
      try {
        localStorage.setItem("udcTheme", "custom");
        localStorage.setItem("udcCustomColors", JSON.stringify({ bg, accent, cardBg, panelBg }));
      } catch (e) {}
    }
  }

  [customBgInput, customAccentInput, customCardBgInput, customPanelBgInput].forEach(input => {
    input.addEventListener("input", () => applyCustomTheme(true));
  });

  function buildThemeSwatches() {
    themeSwatchRow.innerHTML = "";
    themes.forEach(t => {
      const sw = document.createElement("div");
      sw.className = "theme-swatch";
      sw.dataset.themeId = t.id;
      sw.title = t.label;
      sw.style.background = `linear-gradient(135deg, ${t.bg} 50%, ${t.accent} 50%)`;
      sw.addEventListener("click", () => applyTheme(t.id));
      themeSwatchRow.appendChild(sw);
    });

    const customSw = document.createElement("div");
    customSw.className = "theme-swatch";
    customSw.dataset.themeId = "custom";
    customSw.title = "Custom";
    customSw.style.background = "conic-gradient(red, yellow, lime, cyan, blue, magenta, red)";
    customSw.addEventListener("click", () => applyTheme("custom"));
    themeSwatchRow.appendChild(customSw);
  }

  cogButton.addEventListener("click", (e) => {
    e.stopPropagation();
    themeMenu.style.display = themeMenu.style.display === "block" ? "none" : "block";
  });

  document.addEventListener("click", (e) => {
    if (themeMenu.style.display === "block" && !themeMenu.contains(e.target) && e.target !== cogButton) {
      themeMenu.style.display = "none";
    }
  });

  editPlayersButton.addEventListener("click", () => {
    themeMenu.style.display = "none";
    resetSetupFields(
      players.length ? players : ["", ""],
      Number.isFinite(totalRounds) ? totalRounds : 5,
      unlimitedRounds,
      trackingEnabled
    );
    openSetupOverlay();
  });

  restartGameButton.addEventListener("click", () => {
    themeMenu.style.display = "none";
    if (trackingEnabled && players.length === 0) {
      resetSetupFields();
      openSetupOverlay();
      return;
    }
    currentPlayerIndex = 0;
    currentRound = 1;
    gameStarted = true;
    buildDeckFromEnabledCategories();
    preloadNextCard();
    updateTurnTracker();
  });

  try {
    const savedTheme = localStorage.getItem("udcTheme");
    buildThemeSwatches();
    if (savedTheme === "custom") {
      const saved = JSON.parse(localStorage.getItem("udcCustomColors") || "null");
      if (saved) {
        customBgInput.value = saved.bg;
        customAccentInput.value = saved.accent;
        customCardBgInput.value = saved.cardBg;
        customPanelBgInput.value = saved.panelBg;
        applyCustomTheme(false);
        customThemePanel.style.display = "block";
        document.querySelectorAll(".theme-swatch").forEach(el => {
          el.classList.toggle("active", el.dataset.themeId === "custom");
        });
      } else {
        applyTheme("mono");
      }
    } else {
      applyTheme(savedTheme || "mono");
    }
  } catch (e) {
    buildThemeSwatches();
    applyTheme("mono");
  }

  // ---------- Category settings ----------
  const CATEGORY_PREF_VERSION = 4; // bump this to force a fresh default for everyone

function loadEnabledCategoriesFromStorage(allCategoryNames) {
    let stored = null;
    let storedVersion = 0;
    try {
      stored = JSON.parse(localStorage.getItem("udcEnabledCategories") || "null");
      storedVersion = parseInt(localStorage.getItem("udcEnabledCategoriesVersion") || "0", 10) || 0;
    } catch (e) {}

    const isSpicy = (c) => c.trim().toLowerCase() === "spicy";

    if (Array.isArray(stored) && storedVersion >= CATEGORY_PREF_VERSION) {
      const storedSet = new Set(stored);
      enabledCategories = new Set(allCategoryNames.filter(c => storedSet.has(c)));
    } else {
      // First run, or outdated stored preference: enable everything except "Spicy".
      enabledCategories = new Set(allCategoryNames.filter(c => !isSpicy(c)));
      saveEnabledCategoriesToStorage();
    }
}

function saveEnabledCategoriesToStorage() {
    try {
      localStorage.setItem("udcEnabledCategories", JSON.stringify([...enabledCategories]));
      localStorage.setItem("udcEnabledCategoriesVersion", String(CATEGORY_PREF_VERSION));
    } catch (e) {}
}

  function saveEnabledCategoriesToStorage() {
    try {
      localStorage.setItem("udcEnabledCategories", JSON.stringify([...enabledCategories]));
    } catch (e) {}
  }

  function setAllCategories(enabled) {
    const categories = getUniqueCategories();
    enabledCategories = enabled ? new Set(categories) : new Set();
    saveEnabledCategoriesToStorage();
    buildCategoryList();
    buildDeckFromEnabledCategories();
  }

  selectAllCategoriesButton.addEventListener("click", () => setAllCategories(true));
  deselectAllCategoriesButton.addEventListener("click", () => setAllCategories(false));

  function buildCategoryList() {
    const categories = getUniqueCategories();
    categoryList.innerHTML = "";

    if (categories.length === 0) {
      categoryList.innerHTML = `<div class="category-empty">No categories found.</div>`;
      return;
    }

    categories.forEach(cat => {
      const id = "cat-" + cat.replace(/[^a-z0-9]/gi, "_");
      const wrapper = document.createElement("label");
      wrapper.setAttribute("for", id);

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = id;
      checkbox.checked = enabledCategories.has(cat);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          enabledCategories.add(cat);
        } else {
          enabledCategories.delete(cat);
        }
        saveEnabledCategoriesToStorage();
        buildDeckFromEnabledCategories();
      });

      const dot = document.createElement("span");
      dot.className = "category-swatch-dot";
      dot.style.backgroundColor = categoryColours[cat] || "#999999";

      const text = document.createElement("span");
      text.textContent = cat;

      wrapper.appendChild(checkbox);
      wrapper.appendChild(dot);
      wrapper.appendChild(text);
      categoryList.appendChild(wrapper);
    });
  }

  // ---------- Card loading ----------
  fetch("AppFiles/Data/cards.json")
    .then((response) => response.json())
    .then((data) => {
      // NEW grouped shape: one entry per category, Rules is an array.
      allCards = [...data];

      // Build category colours + flat draws from the grouped data.
      allDraws = [];
      data.forEach(group => {
        if (group.Category && !(group.Category in categoryColours)) {
          categoryColours[group.Category] = group.Colour || "#999999";
        }
        allDraws.push(...groupToDraws(group));
      });

      const uniqueCategories = getUniqueCategories();
      loadEnabledCategoriesFromStorage(uniqueCategories);
      buildCategoryList();

      buildDeckFromEnabledCategories();
      preloadNextCard();
      resetSetupFields();

      cardFront.innerHTML = "Ultimate Drinking Cards";
      cardBack.innerHTML = "";
    })
    .catch((error) => {
  console.error("Error loading cards:", error);
  cardFront.innerHTML = `<div class="loading-text" style="color:#ff4747;">Failed to load cards. Check your connection and refresh.</div>`;
});

  function pickCardType() {
    const r = Math.random();
    if (r < RED_CHANCE) return "red";
    if (r < RED_CHANCE + BLACK_CHANCE) return "black";
    return "white";
  }

  function generateCardContent(card) {
    const type = pickCardType();

    const tripleBadge = type === "red"
      ? `<div class="tripleBadge">×3!</div>`
      : "";

    return {
      type,
      content: `
        <div class="instructionText">
          ${card.Rule} 
        </div>
        ${tripleBadge}
        <div class="categoryText" style="color: ${card.Colour};">
          ${card.Category}
        </div>
      `,
    };
  }

  function preloadNextCard() {
    if (cards.length === 0) {
    cardBack.dataset.content = `
      <div class="emptyDeck">
        <div class="emptyDeckEmoji">🎉</div>
        <div class="emptyDeckTitle">Deck complete!</div>
        <div class="emptyDeckSub">You've drawn every card in play.</div>
      </div>
    `;
    cardBack.dataset.type = "white";
      cardBack.dataset.categoryColour = "#000000";
      return;
    }

    const randomIndex = Math.floor(Math.random() * cards.length);
    const newCard = cards.splice(randomIndex, 1)[0];
    const { type, content } = generateCardContent(newCard);

    cardBack.dataset.content = content;
    cardBack.dataset.type = type;
    cardBack.dataset.categoryColour = newCard.Colour;
  }

  const INSTRUCTION_MAX_FONT_SIZE = 27;
  const INSTRUCTION_MIN_FONT_SIZE = 13;

  function fitInstructionText(container) {
    const el = container.querySelector(".instructionText");
    if (!el) return;
    let fontSize = INSTRUCTION_MAX_FONT_SIZE;
    el.style.fontSize = fontSize + "px";
    const maxHeight = container.clientHeight - 60;
    let guard = 0;
    while (el.scrollHeight > maxHeight && fontSize > INSTRUCTION_MIN_FONT_SIZE && guard < 40) {
      fontSize -= 1;
      el.style.fontSize = fontSize + "px";
      guard++;
    }
  }

function applyPreloadedContent(isFront = true) {
  const target = isFront ? cardFront : cardBack;
  const type = cardBack.dataset.type || "white";
  const glow = hexToRgba(cardBack.dataset.categoryColour || "#999999", 0.25);

  target.innerHTML = cardBack.dataset.content || "";
  target.classList.remove("type-black", "type-red");
  if (type === "black") target.classList.add("type-black");
  if (type === "red") target.classList.add("type-red");

  coverCard.classList.remove("type-black", "type-red");
  if (type === "black") coverCard.classList.add("type-black");
  if (type === "red") coverCard.classList.add("type-red");

  coverCard.style.setProperty("--category-glow", glow);
  cardFront.style.setProperty("--category-glow", glow);
  cardBack.style.setProperty("--category-glow", glow);

  requestAnimationFrame(() => fitInstructionText(target));
}

  function playCardSound(type) {
    let file = "AppFiles/Sounds/flip.mp3";
    if (type === "black") file = "AppFiles/Sounds/black.mp3";
    if (type === "red") file = "AppFiles/Sounds/red.mp3";
    const audio = new Audio(file);
    audio.play().catch(() => {});
  }

  function flipCard() {
    if (!gameStarted) {
      const clickAudio = new Audio("AppFiles/Sounds/click.mp3");
      clickAudio.play().catch(() => {});
      openSetupOverlay();
      return;
    }

const upcomingType = cardBack.dataset.type || "white";


      const blackFlash = document.getElementById("blackFlash");
      let blackFlashTimeout = null;
      function triggerBlackFlash() {
        blackFlash.classList.add("active");
        if (blackFlashTimeout) clearTimeout(blackFlashTimeout);
        blackFlashTimeout = setTimeout(() => blackFlash.classList.remove("active"), 220);
      }
      
      const redFlash = document.getElementById("redFlash");
      let redFlashTimeout = null;

function triggerRedFlash() {
  redFlash.classList.add("active");
  if (redFlashTimeout) clearTimeout(redFlashTimeout);
  redFlashTimeout = setTimeout(() => {
    redFlash.classList.remove("active");
  }, 180);
}

    // Count the card being revealed.
    if (drawnCount < totalDrawsInPlay) {
      drawnCount++;
    }

    if (showingFront) {
      applyPreloadedContent(false);
    } else {
      applyPreloadedContent(true);
    }

    preloadNextCard();
    updateCardCounter();

    coverCard.classList.toggle("flipped");
    // after toggle, if we were showing front, we're now showing back
    coverCard.classList.toggle("face-up", showingFront);
    showingFront = !showingFront;

    playCardSound(upcomingType);

    if (upcomingType === "red") {
    triggerRedFlash();
    }
    if (upcomingType === "black") {
    triggerBlackFlash();
    }

    // Haptics
if (upcomingType === "red") {
  vibrate([30, 40, 60]);
} else if (upcomingType === "black") {
  vibrate([40]);
} else {
  vibrate([12]);
}

// Screen-reader announcement
const srAnnouncer = document.getElementById("srAnnouncer");
if (srAnnouncer) {
  const ruleText = (cardBack.dataset.content || "")
    .replace(/<[^>]+>/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  srAnnouncer.textContent = `${upcomingType} card. ${ruleText}`;
}

    advanceTurn();
  }

  coverCard.addEventListener("click", flipCard);

  coverCard.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter" || e.code === "Space") {
    e.preventDefault();
    flipCard();
  }
});

  // ---------- Rules modal ----------
  const showRulesLink = document.getElementById("showRulesLink");
  const rulesModal = document.getElementById("rulesModal");
  const closeRulesButton = document.getElementById("closeRulesButton");
  const viewAllCardsButton = document.getElementById("viewAllCardsButton");
  const rulesText = document.getElementById("rulesText");

  let rulesViewMode = "rules";

  const embeddedRulesHTML = `
    <h2>How to Play</h2>
    <ol>
      <li>Take it in turns tapping the card to draw a new one.</li>
      <li><span class="rule-card-tag white">White card</span> Perform the instruction shown on the card.</li>
      <li><span class="rule-card-tag black">Black card</span> Invert the instruction, then perform the inverted version.</li>
      <li><span class="rule-card-tag red">Red card</span> Rarer than black cards &mdash; perform the instruction, but do it <strong>three times</strong>!</li>
    </ol>
    <h3>A note on inverted cards</h3>
    <ul>
      <li>Some inverted cards make more sense than others.</li>
      <li>Don't worry if a card isn't obviously invertible &mdash; just try it, stay chill, and have fun.</li>
    </ul>
    <p class="tip">Tip: use the ⚙️ menu to add players, set the number of rounds, change the theme, or turn categories on/off at any time.</p>
  `;

  function escapeHTML(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function getUniqueCategories() {
    const set = new Set(allCards.map((c) => c.Category || "").filter(Boolean));
    return [...set].sort((a, b) => a.localeCompare(b));
  }

  function buildAllCardsControlsHTML() {
    const categories = getUniqueCategories();
    const options = categories
      .map((cat) => `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`)
      .join("");
    return `
      <div class="all-cards-controls">
        <input type="text" id="allCardsSearchInput" placeholder="Search cards...">
        <select id="allCardsCategoryFilter">
          <option value="">All Categories</option>
          ${options}
        </select>
      </div>
    `;
  }

  function buildAllCardsListHTML(searchTerm, categoryFilter) {
    if (!allDraws.length) {
      return `<p class="all-cards-empty">Cards are still loading &mdash; give it a moment and try again.</p>`;
    }

    const term = (searchTerm || "").trim().toLowerCase();
    const filtered = allDraws.filter((c) => {
      const matchesCategory = !categoryFilter || c.Category === categoryFilter;
      if (!matchesCategory) return false;
      if (!term) return true;
      const rule = (c.Rule || "").toLowerCase();
      const category = (c.Category || "").toLowerCase();
      return rule.includes(term) || category.includes(term);
    });

    if (!filtered.length) {
      return `<p class="all-cards-empty">No cards match your search.</p>`;
    }

    const rows = filtered
      .map((c) => {
        const colour = c.Colour || "#999999";
        return `
          <li>
            <span class="all-cards-category-tag" style="background-color: ${colour};">${escapeHTML(c.Category || "")}</span>
            ${escapeHTML(c.Rule || "")}
          </li>
        `;
      })
      .join("");

    return `<p class="all-cards-count">Showing ${filtered.length} of ${allDraws.length} cards</p><ul class="all-cards-list">${rows}</ul>`;
  }

  function displayEmbeddedRules() {
    rulesText.innerHTML = embeddedRulesHTML;
    rulesViewMode = "rules";
    viewAllCardsButton.textContent = "View All Cards";
    rulesModal.style.display = "flex";
  }

  function displayAllCards() {
    rulesText.innerHTML = `
      <h2>All Cards</h2>
      ${buildAllCardsControlsHTML()}
      <div id="allCardsListContainer">${buildAllCardsListHTML("", "")}</div>
    `;
    rulesViewMode = "cards";
    viewAllCardsButton.textContent = "Back to Rules";

    const searchInput = document.getElementById("allCardsSearchInput");
    const categoryFilter = document.getElementById("allCardsCategoryFilter");
    const listContainer = document.getElementById("allCardsListContainer");

    function refreshList() {
      listContainer.innerHTML = buildAllCardsListHTML(searchInput.value, categoryFilter.value);
    }

    searchInput.addEventListener("input", refreshList);
    categoryFilter.addEventListener("change", refreshList);
  }

  showRulesLink.addEventListener("click", (event) => {
    event.preventDefault();
    displayEmbeddedRules();
  });

  viewAllCardsButton.addEventListener("click", () => {
    if (rulesViewMode === "rules") {
      displayAllCards();
    } else {
      displayEmbeddedRules();
    }
  });

  closeRulesButton.addEventListener("click", () => {
    rulesModal.style.display = "none";
  });

  rulesModal.addEventListener("click", (e) => {
    if (e.target === rulesModal) rulesModal.style.display = "none";
  });

function vibrate(pattern) {
  if (navigator.vibrate && !prefersReducedMotion) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}
  


  </script>

</body>
</html>
